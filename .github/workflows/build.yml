name: Build APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Mobile & Wear APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Use gradle/gradle-build-action which downloads and caches a
      # specific Gradle distribution, then exposes `gradle` on PATH.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      # Build directly with the `gradle` CLI (no wrapper required).
      - name: Build Mobile Debug APK
        run: gradle :mobile:assembleDebug --stacktrace --no-daemon --no-configuration-cache

      - name: Build Wear Debug APK
        run: gradle :wear:assembleDebug --stacktrace --no-daemon --no-configuration-cache

      - name: Upload Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartConnect-Mobile-APK
          path: mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Wear APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartConnect-Wear-APK
          path: wear/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
