name: Build APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Mobile & Wear APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.4'

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x gradlew

      - name: Build Mobile Debug APK
        run: ./gradlew :mobile:assembleDebug --stacktrace --no-daemon

      - name: Build Wear Debug APK
        run: ./gradlew :wear:assembleDebug --stacktrace --no-daemon

      - name: Upload Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartConnect-Mobile-APK
          path: mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Wear APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartConnect-Wear-APK
          path: wear/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
