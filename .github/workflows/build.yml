name: Build APKs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Download gradlew
      run: |
        wget https://raw.githubusercontent.com/gradle/gradle/master/gradlew -O gradlew
        chmod +x gradlew
    
    - name: Build Debug APKs
      run: ./gradlew assembleDebug --no-daemon --stacktrace
    
    - name: Upload Mobile APK
      uses: actions/upload-artifact@v4
      with:
        name: mobile-debug-apk
        path: mobile/build/outputs/apk/debug/mobile-debug.apk
        if-no-files-found: error
    
    - name: Upload Wear APK
      uses: actions/upload-artifact@v4
      with:
        name: wear-debug-apk
        path: wear/build/outputs/apk/debug/wear-debug.apk
        if-no-files-found: error
