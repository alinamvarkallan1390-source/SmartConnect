name: Build APKs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: "8.6"
        build-root-directory: SmartConnect

    - name: Generate Gradle Wrapper JAR
      working-directory: SmartConnect
      run: gradle wrapper --gradle-version=8.6 --no-daemon

    - name: Build Mobile Debug APK
      working-directory: SmartConnect
      run: ./gradlew :mobile:assembleDebug --no-daemon --stacktrace

    - name: Build Wear Debug APK
      working-directory: SmartConnect
      run: ./gradlew :wear:assembleDebug --no-daemon --stacktrace

    - name: Upload Mobile APK
      uses: actions/upload-artifact@v4
      with:
        name: mobile-debug-apk
        path: SmartConnect/mobile/build/outputs/apk/debug/*.apk
        if-no-files-found: error

    - name: Upload Wear APK
      uses: actions/upload-artifact@v4
      with:
        name: wear-debug-apk
        path: SmartConnect/wear/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
